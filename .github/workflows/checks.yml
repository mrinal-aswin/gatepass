name: checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Claude Code CLI (validation only; no sign-in needed)
        run: npm install -g @anthropic-ai/claude-code
      - name: Run checks
        run: bash tools/check.sh
